name: CI Android Workflow
run-name: CI#${{ github.run_number }} - ${{ github.actor }} - branch "${{ github.head_ref }}"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
    paths:
      - 'android/**'

jobs:
  formatting:
    name: Validate formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate
        working-directory: "android"
        run: ./gradlew spotlessCheck
