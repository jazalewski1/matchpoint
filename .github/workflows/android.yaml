on:
  push:
    paths:
      - 'android/**'

jobs:
  formatting:
    name: Validate formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate
        run: ./gradlew spotlessCheck
